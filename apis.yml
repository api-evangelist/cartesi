aid: cartesi
name: Cartesi
description: >-
  Cartesi is a Linux-based optimistic rollup protocol that lets developers
  build decentralized applications by running rich off-chain computation
  inside a sandboxed Linux virtual machine. The core of the stack is the
  Cartesi Machine, a deterministic RISC-V emulator that boots a real Linux
  userland so dApps can be written in any language (Rust, Go, Python,
  JavaScript/TypeScript, C++) using familiar libraries, then settle results
  on Ethereum and other EVM chains through Cartesi Rollups smart contracts.
  Cartesi Rollups 2.0 is the current major version, packaging an
  application-specific rollup as the combination of the Cartesi Machine,
  the Cartesi Rollups Node middleware (Rust + Go), and a set of Solidity
  rollup contracts that handle settlement, consensus, and data availability.
  The DAVE permissionless fraud-proof system provides Stage-2 trust
  minimization, while the Cartesi CLI (the successor to Sunodo) packages
  scaffolding, build, and local devnet workflows. Cartesi is stewarded by
  The Cartesi Foundation and the CTSI token governs the network. Cartesi is
  fully open source under Apache-2.0 and LGPL-3.0 licenses on
  github.com/cartesi; there is no proprietary SaaS product, but the Rollups
  Node ships several developer-facing surfaces — the Rollup HTTP API used
  by application backends, the Inspect HTTP API for read-only queries from
  frontends, a GraphQL reader for advance-state inputs / outputs / vouchers
  / notices / reports, and a JSON-RPC node API for operations.
